name: Verify Pocket Contracts

on:
  push:
    paths:
      - "contracts/pocket/v1/**"
      - "docs/adr/**"
      - "docs/requirement/requirements.md"
      - "docs/plan/20260813_PLAN1.md"
      - "script/verify_pocket_contracts.py"
      - ".github/workflows/pocket-contracts-verify.yml"
  pull_request:
    paths:
      - "contracts/pocket/v1/**"
      - "docs/adr/**"
      - "docs/requirement/requirements.md"
      - "docs/plan/20260813_PLAN1.md"
      - "script/verify_pocket_contracts.py"
      - ".github/workflows/pocket-contracts-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }} deterministic contract verifier
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            slug: ubuntu
            os: ubuntu-24.04
          - name: macOS
            slug: macos
            os: macos-14
          - name: Windows
            slug: windows
            os: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.7"
          check-latest: false

      - name: Verify contracts twice
        shell: bash
        run: |
          set -euo pipefail
          python script/verify_pocket_contracts.py --report-json pocket-contracts-report-1.json
          python script/verify_pocket_contracts.py --report-json pocket-contracts-report-2.json --quiet
          python - <<'PY'
          from pathlib import Path

          first = Path("pocket-contracts-report-1.json").read_bytes()
          second = Path("pocket-contracts-report-2.json").read_bytes()
          if first != second:
              raise SystemExit("contract verifier report is not deterministic")
          print(first.decode("utf-8"), end="")
          PY

      - name: Upload deterministic report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pocket-contract-report-${{ matrix.slug }}
          path: pocket-contracts-report-1.json
          if-no-files-found: error
          retention-days: 7

  compare-reports:
    name: Compare reports across all operating systems
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pocket-contract-report-*
          path: reports

      - name: Require byte-identical reports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = sorted(Path("reports").glob("*/pocket-contracts-report-1.json"))
          if len(paths) != 3:
              raise SystemExit(f"expected 3 OS reports, found {len(paths)}")
          baseline = paths[0].read_bytes()
          different = [str(path) for path in paths[1:] if path.read_bytes() != baseline]
          if different:
              raise SystemExit("cross-OS contract reports differ: " + ", ".join(different))
          print("Cross-OS reports are byte-identical:", ", ".join(str(path) for path in paths))
          PY
