name: Verify Published Release Readback

on:
  push:
    paths:
      - "script/verify_release_readback.py"
      - "script/tests/test_verify_release_readback.py"
      - "windows/script/verify_published_authenticode.ps1"
      - ".github/workflows/release-readback-verify.yml"
  pull_request:
    paths:
      - "script/verify_release_readback.py"
      - "script/tests/test_verify_release_readback.py"
      - "windows/script/verify_published_authenticode.ps1"
      - ".github/workflows/release-readback-verify.yml"
  schedule:
    - cron: "37 18 * * 1"
  workflow_dispatch:
    inputs:
      windows_tag:
        description: "Windows release tag, or auto"
        required: true
        default: "auto"
        type: string
      windows_signing_gate:
        description: "beta accepts declared unsigned releases; formal requires timestamped Authenticode readback"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - formal

permissions:
  contents: read

jobs:
  deterministic-unit:
    name: Deterministic release metadata verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.7"
          check-latest: false

      - name: Run deterministic tests
        run: python -m unittest script/tests/test_verify_release_readback.py

  powershell-contract:
    name: Windows Authenticode verifier syntax
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse PowerShell verifier
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "windows/script/verify_published_authenticode.ps1"),
            [ref]$null,
            [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  resolve-windows-release:
    name: Pin one Windows release tag
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [deterministic-unit, powershell-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      windows_tag: ${{ steps.resolve.outputs.windows_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.7"
          check-latest: false

      - name: Resolve published Windows tag once
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WINDOWS_TAG: ${{ inputs.windows_tag || 'auto' }}
        run: |
          resolved_tag=$(python script/verify_release_readback.py \
            --windows-tag "$WINDOWS_TAG" \
            --resolve-windows-tag-only)
          echo "windows_tag=$resolved_tag" >> "$GITHUB_OUTPUT"

  published-readback:
    name: Read back macOS and Windows public releases
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [resolve-windows-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.7"
          check-latest: false

      - name: Verify published release surfaces
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WINDOWS_TAG: ${{ needs.resolve-windows-release.outputs.windows_tag }}
          WINDOWS_SIGNING_GATE: ${{ inputs.windows_signing_gate || 'beta' }}
        run: |
          python script/verify_release_readback.py \
            --windows-tag "$WINDOWS_TAG" \
            --windows-signing-gate "$WINDOWS_SIGNING_GATE" \
            --json | tee release-readback-report.json

      - name: Upload readback report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-release-readback
          path: release-readback-report.json
          if-no-files-found: error
          retention-days: 30

  formal-authenticode-readback:
    name: Read back timestamped Windows Authenticode
    if: github.event_name == 'workflow_dispatch' && inputs.windows_signing_gate == 'formal'
    needs: [resolve-windows-release]
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify public Setup, Portable, and update package signatures
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WINDOWS_TAG: ${{ needs.resolve-windows-release.outputs.windows_tag }}
        run: |
          windows/script/verify_published_authenticode.ps1 `
            -Tag "$env:WINDOWS_TAG" | Tee-Object -FilePath authenticode-readback-report.json

      - name: Upload Authenticode readback report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-authenticode-readback
          path: authenticode-readback-report.json
          if-no-files-found: error
          retention-days: 30
