name: Verify Windows

on:
  push:
    branches: ["main"]
    paths:
      - "windows/**"
      - "contracts/voice/**"
      - "script/verify_voice_foundation.py"
      - ".github/workflows/windows-verify.yml"
  pull_request:
    paths:
      - "windows/**"
      - "contracts/pocket/v1/**"
      - "contracts/voice/**"
      - "script/verify_voice_foundation.py"
      - ".github/workflows/windows-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      HOVERPOCKET_VERIFY_LOG: ${{ github.workspace }}/hoverpocket-verify.log
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Prepare pinned Codex CLI for confinement canary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vendorRoot = Join-Path $env:RUNNER_TEMP "hoverpocket-codex-0.145.0"
          [void](New-Item -ItemType Directory -Path $vendorRoot)
          $archiveNames = @(& npm pack "@openai/codex@0.145.0-win32-x64" --pack-destination $vendorRoot --silent)
          if ($LASTEXITCODE -ne 0 -or $archiveNames.Count -ne 1) {
            throw "Pinned Codex vendor archive download failed."
          }
          $archivePath = Join-Path $vendorRoot ([string]$archiveNames[0]).Trim()
          $expectedArchiveSha512 = "bb487d964d3de02697452a84df84815b67516904cf6ba7c0497a9e85ccd61fd41db14eb6981b2202001da7ab421b88be6333e69a18c3f05757367606366c2e32"
          $archiveSha512 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($archiveSha512 -cne $expectedArchiveSha512) {
            throw "Pinned Codex vendor archive integrity check failed."
          }
          & tar.exe -xzf $archivePath -C $vendorRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned Codex vendor archive extraction failed."
          }
          $codexBin = Join-Path $vendorRoot "package\vendor\x86_64-pc-windows-msvc\bin\codex.exe"
          "HOVERPOCKET_CODEX_BIN=$codexBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Codex generation confinement verifier
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\windows\script\verify_codex_generation_confinement.ps1),
            [ref]$tokens,
            [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          .\windows\script\verify_codex_generation_confinement.ps1 -SelfTest

      - name: Verify unelevated sandbox cannot replace the elevated boundary
        shell: pwsh
        timeout-minutes: 2
        run: .\windows\script\verify_codex_generation_confinement.ps1 -CodexBin $env:HOVERPOCKET_CODEX_BIN -SandboxImplementation unelevated -ExpectUnelevatedReadOnlyRejection

      - name: Build Release
        run: dotnet build .\windows\HoverPocket.Windows.sln --configuration Release --nologo -p:NuGetAudit=false

      - name: Build Debug Voice E2E host
        run: dotnet build .\windows\HoverPocket.Windows.sln --configuration Debug --nologo --no-restore -p:NuGetAudit=false -p:TreatWarningsAsErrors=true

      - name: Verify settings UI modules
        run: |
          node --check .\windows\ui\js\app.js
          node --check .\windows\ui\settings\settings.js
          node .\windows\script\verify_settings_generation_target.mjs
          python .\script\verify_voice_foundation.py

      - name: Verify capabilities
        run: dotnet run --project .\windows\src\HoverPocket.Shell\HoverPocket.Shell.csproj --configuration Release --no-build -- --verify capabilities

      - name: Verify Broker
        run: dotnet run --project .\windows\src\HoverPocket.Shell\HoverPocket.Shell.csproj --configuration Release --no-build -- --verify broker

      - name: Verify Pocket Surface
        timeout-minutes: 2
        run: dotnet run --project .\windows\src\HoverPocket.Shell\HoverPocket.Shell.csproj --configuration Release --no-build -- --verify pocket-surface

      - name: Verify timer
        run: dotnet run --project .\windows\src\HoverPocket.Shell\HoverPocket.Shell.csproj --configuration Release --no-build -- --verify timer

      - name: Verify UI model
        run: dotnet run --project .\windows\src\HoverPocket.Shell\HoverPocket.Shell.csproj --configuration Release --no-build -- --verify ui-model

      - name: Verify settings
        run: dotnet run --project .\windows\src\HoverPocket.Shell\HoverPocket.Shell.csproj --configuration Release --no-build -- --verify settings

      - name: Verify legacy AI lane absence
        run: dotnet run --project .\windows\src\HoverPocket.Shell\HoverPocket.Shell.csproj --configuration Release --no-build -- --verify ailane

      - name: Verify Voice foundation
        timeout-minutes: 2
        run: dotnet run --project .\windows\src\HoverPocket.Shell\HoverPocket.Shell.csproj --configuration Release --no-build -- --verify voice

      - name: Verify Voice E2E isolation
        run: dotnet run --project .\windows\src\HoverPocket.Shell\HoverPocket.Shell.csproj --configuration Debug --no-build -- --verify voice-e2e-isolation

      - name: Verify Voice E2E PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\windows\script\voice_e2e_windows.ps1),
            [ref]$tokens,
            [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Verify updater
        run: dotnet run --project .\windows\src\HoverPocket.Shell\HoverPocket.Shell.csproj --configuration Release --no-build -- --verify updater

      - name: Verify release signing contract
        shell: pwsh
        run: .\windows\script\publish_release.ps1 -SigningContractTest

      - name: Verify rendered WebView UI
        run: dotnet run --project .\windows\src\HoverPocket.Shell\HoverPocket.Shell.csproj --configuration Release --no-build -- --verify ui

      - name: Print verification log
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:HOVERPOCKET_VERIFY_LOG) {
            Get-Content -LiteralPath $env:HOVERPOCKET_VERIFY_LOG
          }
