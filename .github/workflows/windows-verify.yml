name: Verify Windows

on:
  push:
    branches: ["main"]
    paths:
      - "windows/**"
      - ".github/workflows/windows-verify.yml"
  pull_request:
    paths:
      - "windows/**"
      - "contracts/pocket/v1/**"
      - ".github/workflows/windows-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      HOVERPOCKET_VERIFY_LOG: ${{ github.workspace }}/hoverpocket-verify.log
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build Release
        run: dotnet build .\windows\HoverPocket.Windows.sln --configuration Release --nologo -p:NuGetAudit=false

      - name: Verify timer model and bridge
        run: |
          dotnet run --project .\windows\src\HoverPocket.Shell\HoverPocket.Shell.csproj --configuration Release --no-build -- --verify capabilities
          dotnet run --project .\windows\src\HoverPocket.Shell\HoverPocket.Shell.csproj --configuration Release --no-build -- --verify broker
          dotnet run --project .\windows\src\HoverPocket.Shell\HoverPocket.Shell.csproj --configuration Release --no-build -- --verify pocket-surface
          dotnet run --project .\windows\src\HoverPocket.Shell\HoverPocket.Shell.csproj --configuration Release --no-build -- --verify timer
          dotnet run --project .\windows\src\HoverPocket.Shell\HoverPocket.Shell.csproj --configuration Release --no-build -- --verify ui-model
          dotnet run --project .\windows\src\HoverPocket.Shell\HoverPocket.Shell.csproj --configuration Release --no-build -- --verify updater

      - name: Verify rendered WebView UI
        run: dotnet run --project .\windows\src\HoverPocket.Shell\HoverPocket.Shell.csproj --configuration Release --no-build -- --verify ui

      - name: Print verification log
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:HOVERPOCKET_VERIFY_LOG) {
            Get-Content -LiteralPath $env:HOVERPOCKET_VERIFY_LOG
          }
