name: Verify macOS Capabilities

on:
  push:
    branches: ["main"]
    paths:
      - "Sources/HoverPocket/Capabilities/**"
      - "Sources/HoverPocket/PocketApps/**"
      - "Sources/HoverPocket/App/CapabilityVerificationCommand.swift"
      - "Sources/HoverPocket/App/CapabilityBrokerVerificationCommand.swift"
      - "Sources/HoverPocket/App/PocketAppPackageVerificationCommand.swift"
      - "Sources/HoverPocket/App/PocketSurfaceVerificationCommand.swift"
      - "Sources/HoverPocket/App/AppDelegate.swift"
      - "Sources/HoverPocket/App/MacOSVoiceE2EIsolationVerificationCommand.swift"
      - "Sources/HoverPocket/App/VoiceFoundationVerificationCommand.swift"
      - "Sources/HoverPocket/Support/HoverPocketRuntimeEnvironment.swift"
      - "Sources/HoverPocket/State/AppSettings.swift"
      - "Sources/HoverPocket/State/ClipboardHistoryStore.swift"
      - "Sources/HoverPocket/Views/HoverPanelShell.swift"
      - "Sources/HoverPocket/Views/SettingsView.swift"
      - "Sources/HoverPocket/Views/VoiceLaneHostView.swift"
      - "Sources/HoverPocket/Voice/**"
      - "Sources/HoverPocket/Windowing/HoverWindowController.swift"
      - "Sources/HoverPocket/Windowing/PanelGeometry.swift"
      - "Sources/HoverPocket/Models/GoogleCalendarModels.swift"
      - "Sources/HoverPocket/Models/StickyNoteModels.swift"
      - "Sources/HoverPocket/Models/AIModelModels.swift"
      - "Sources/HoverPocket/Models/PocketActionModels.swift"
      - "Sources/HoverPocket/Providers/GoogleCalendarProvider.swift"
      - "Sources/HoverPocket/Services/AppleFoundationModelProvider.swift"
      - "Sources/HoverPocket/Services/ApprovalGate.swift"
      - "Sources/HoverPocket/Services/AuditLog.swift"
      - "Sources/HoverPocket/Services/CalendarPocketTool.swift"
      - "Sources/HoverPocket/State/AICommandStore.swift"
      - "Sources/HoverPocket/Views/AICommandPaletteView.swift"
      - "Sources/HoverPocket/Services/GoogleCalendarAPIClient.swift"
      - "Sources/HoverPocket/State/GoogleCalendarStore.swift"
      - "Sources/HoverPocket/State/StickyNotesStore.swift"
      - "Sources/HoverPocket/State/TimerStore.swift"
      - "Sources/HoverPocket/main.swift"
      - "Package.swift"
      - "Package.resolved"
      - "contracts/pocket/v1/**"
      - "contracts/voice/**"
      - "script/build_and_run.sh"
      - "script/verify_codex_auth_control_plane_macos.py"
      - "script/verify_codex_generation_confinement_macos.py"
      - "script/verify_macos_voice_e2e_receipt.py"
      - "script/verify_macos_realtime_renderer.mjs"
      - "script/verify_voice_foundation.py"
      - "script/voice_e2e_macos.sh"
      - ".github/workflows/macos-capabilities-verify.yml"
  pull_request:
    paths:
      - "Sources/HoverPocket/Capabilities/**"
      - "Sources/HoverPocket/PocketApps/**"
      - "Sources/HoverPocket/App/CapabilityVerificationCommand.swift"
      - "Sources/HoverPocket/App/CapabilityBrokerVerificationCommand.swift"
      - "Sources/HoverPocket/App/PocketAppPackageVerificationCommand.swift"
      - "Sources/HoverPocket/App/PocketSurfaceVerificationCommand.swift"
      - "Sources/HoverPocket/App/AppDelegate.swift"
      - "Sources/HoverPocket/App/MacOSVoiceE2EIsolationVerificationCommand.swift"
      - "Sources/HoverPocket/App/VoiceFoundationVerificationCommand.swift"
      - "Sources/HoverPocket/Support/HoverPocketRuntimeEnvironment.swift"
      - "Sources/HoverPocket/State/AppSettings.swift"
      - "Sources/HoverPocket/State/ClipboardHistoryStore.swift"
      - "Sources/HoverPocket/Views/HoverPanelShell.swift"
      - "Sources/HoverPocket/Views/SettingsView.swift"
      - "Sources/HoverPocket/Views/VoiceLaneHostView.swift"
      - "Sources/HoverPocket/Voice/**"
      - "Sources/HoverPocket/Windowing/HoverWindowController.swift"
      - "Sources/HoverPocket/Windowing/PanelGeometry.swift"
      - "Sources/HoverPocket/Models/GoogleCalendarModels.swift"
      - "Sources/HoverPocket/Models/StickyNoteModels.swift"
      - "Sources/HoverPocket/Models/AIModelModels.swift"
      - "Sources/HoverPocket/Models/PocketActionModels.swift"
      - "Sources/HoverPocket/Providers/GoogleCalendarProvider.swift"
      - "Sources/HoverPocket/Services/AppleFoundationModelProvider.swift"
      - "Sources/HoverPocket/Services/ApprovalGate.swift"
      - "Sources/HoverPocket/Services/AuditLog.swift"
      - "Sources/HoverPocket/Services/CalendarPocketTool.swift"
      - "Sources/HoverPocket/State/AICommandStore.swift"
      - "Sources/HoverPocket/Views/AICommandPaletteView.swift"
      - "Sources/HoverPocket/Services/GoogleCalendarAPIClient.swift"
      - "Sources/HoverPocket/State/GoogleCalendarStore.swift"
      - "Sources/HoverPocket/State/StickyNotesStore.swift"
      - "Sources/HoverPocket/State/TimerStore.swift"
      - "Sources/HoverPocket/main.swift"
      - "Package.swift"
      - "Package.resolved"
      - "contracts/pocket/v1/**"
      - "contracts/voice/**"
      - "script/build_and_run.sh"
      - "script/verify_codex_auth_control_plane_macos.py"
      - "script/verify_codex_generation_confinement_macos.py"
      - "script/verify_macos_voice_e2e_receipt.py"
      - "script/verify_macos_realtime_renderer.mjs"
      - "script/verify_voice_foundation.py"
      - "script/voice_e2e_macos.sh"
      - ".github/workflows/macos-capabilities-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Verify Host-owned Voice Lane foundation
        run: |
          bash -n script/build_and_run.sh
          bash -n script/voice_e2e_macos.sh
          python3 -m py_compile script/verify_codex_auth_control_plane_macos.py
          python3 script/verify_codex_auth_control_plane_macos.py --self-test
          python3 -m py_compile script/verify_codex_generation_confinement_macos.py
          python3 script/verify_codex_generation_confinement_macos.py --self-test
          python3 -m py_compile script/verify_macos_voice_e2e_receipt.py
          python3 script/verify_macos_voice_e2e_receipt.py --self-test
          node script/verify_macos_realtime_renderer.mjs
          python3 script/verify_voice_foundation.py
          .build/debug/HoverPocket --verify-voice-foundation
          .build/debug/HoverPocket --verify-voice-e2e-isolation
          .build/debug/HoverPocket --verify-panel-layout

      - name: Verify capability handlers
        run: .build/debug/HoverPocket --verify-capabilities

      - name: Verify capability broker and text Today Focus
        run: .build/debug/HoverPocket --verify-broker

      - name: Verify Pocket App package and Surface contracts
        run: |
          .build/debug/HoverPocket --verify-pocket-surface
          .build/debug/HoverPocket --verify-pocket-app

      - name: Verify existing Timer behavior
        run: .build/debug/HoverPocket --verify-timer
