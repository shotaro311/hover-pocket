<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HoverPocket 設定</title>
  <link rel="stylesheet" href="./settings.css">
</head>
<body>
  <main class="settings-shell">
    <header class="settings-header">
      <h1 data-i18n="settingsTitle">HoverPocket 設定</h1>
      <button type="button" data-reset>既定値に戻す</button>
    </header>
    <section class="settings-section">
      <h2 data-i18n="language">言語</h2>
      <div class="segmented" data-language></div>
    </section>
    <section class="settings-section">
      <h2 data-i18n="displayPlacement">表示先</h2>
      <div class="segmented" data-display-placement></div>
    </section>
    <section class="settings-section">
      <h2 data-i18n="panelSize">パネルサイズ</h2>
      <div class="segmented" data-panel-size></div>
    </section>
    <section class="settings-section">
      <h2 data-i18n="textSize">文字サイズ</h2>
      <div class="segmented" data-text-size></div>
    </section>
    <section class="settings-section">
      <h2 data-i18n="switchingMode">ツール切替</h2>
      <div class="segmented" data-switching></div>
    </section>
    <section class="settings-section">
      <h2 data-i18n="providerOrder">ツールの表示と順序</h2>
      <div class="provider-list" data-provider-list></div>
    </section>
    <section class="settings-section">
      <h2 data-i18n="providerSelection">起動時のツール</h2>
      <div class="segmented" data-provider-selection></div>
      <label class="select-row">
        <span data-i18n="defaultProvider">固定するツール</span>
        <select data-preferred-provider></select>
      </label>
    </section>
    <section class="settings-section">
      <h2>Pocket Apps</h2>
      <label class="toggle-row">
        <span data-ai-native-label>AIネイティブ機能</span>
        <input type="checkbox" data-ai-native>
      </label>
      <p class="settings-note" data-ai-native-note></p>
      <div class="pocket-app-list" data-pocket-app-list></div>
      <div class="pocket-generation" data-pocket-generation hidden>
        <p class="settings-note" data-pocket-generation-note></p>
        <textarea rows="4" maxlength="8000" data-pocket-generation-request aria-label="Pocket App request"></textarea>
        <div class="settings-button-row settings-spaced-row">
          <button type="button" data-pocket-generate>生成して検証</button>
          <button type="button" data-pocket-cancel>キャンセル</button>
        </div>
        <div class="settings-status" data-pocket-generation-status></div>
        <div class="pocket-app-list settings-spaced-row" data-pocket-generation-proposal></div>
        <div class="pocket-app-list settings-spaced-row" data-pocket-generation-managed></div>
      </div>
    </section>
    <section class="settings-section">
      <h2 data-i18n="topHandle">上端ハンドル</h2>
      <div class="segmented" data-handle-icon></div>
      <label class="toggle-row settings-spaced-row">
        <span data-i18n="showTopHandleSideArea">横幅を広くする</span>
        <input type="checkbox" data-handle-side-area>
      </label>
      <label class="toggle-row settings-spaced-row">
        <span data-i18n="disableInFullscreen">全画面アプリ中は開かない</span>
        <input type="checkbox" data-disable-fullscreen>
      </label>
    </section>
    <section class="settings-section">
      <h2 data-i18n="clipboard">クリップボード</h2>
      <label class="toggle-row">
        <span data-i18n="clipboardPrivateMode">プライベートモード</span>
        <input type="checkbox" data-clipboard-private>
      </label>
      <p class="settings-note" data-i18n="clipboardPrivacyNote">クリップボード履歴はパスワードや個人情報を保存する可能性があります。</p>
    </section>
    <section class="settings-section">
      <h2 data-i18n="stickyNotes">付箋</h2>
      <label class="toggle-row">
        <span data-i18n="stickyUndoToast">取り消し通知を表示</span>
        <input type="checkbox" data-sticky-undo-toast>
      </label>
      <div class="settings-spaced-row">
        <span class="settings-inline-label" data-i18n="stickyGridSize">グリッドサイズ</span>
        <div class="segmented" data-sticky-grid-size></div>
      </div>
    </section>
    <section class="settings-section">
      <label class="toggle-row">
        <span data-i18n="startWithWindows">Windows 起動時に開始</span>
        <input type="checkbox" data-startup>
      </label>
      <div class="settings-status" data-startup-status></div>
    </section>
    <section class="settings-section">
      <h2 data-i18n="systemActions">システム操作</h2>
      <div class="settings-button-row">
        <button type="button" data-reset-binding data-i18n="resetPanelBinding">表示先をメインに戻す</button>
        <button type="button" data-open-data-folder data-i18n="openDataFolder">データフォルダーを開く</button>
      </div>
    </section>
    <section class="settings-section">
      <div class="settings-action-row">
        <div>
          <h2 data-i18n="updates">更新</h2>
          <div class="settings-status" data-update-status></div>
        </div>
        <button type="button" data-check-updates>更新を確認</button>
      </div>
      <label class="toggle-row">
        <span data-i18n="autoCheckForUpdates">起動時に確認</span>
        <input type="checkbox" data-auto-updates>
      </label>
    </section>
    <footer class="settings-footer" data-status></footer>
  </main>
  <script type="module" src="./settings.js"></script>
</body>
</html>
