[package]
name = "hoverpocket-pairing"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false
license = "EUPL-1.2"

[dependencies]
magic-wormhole = { version = "=0.8.1", default-features = false, features = ["native-tls"] }
async-std = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

